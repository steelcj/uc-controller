---
# shared/vars/uc_firewall_interim.yml
#
# Interim, until uc-controller switches from shared/roles/uc_firewall to
# steelcj.foomuuri (see ROADMAP.md). The client inventory already gives its
# firewall values in the shape steelcj.foomuuri takes, one variable per stage,
# so a run that combines stages cannot clobber one with another:
#
#   firewall_onboard_ssh          onboard/<env>/group_vars/all.yml
#                                 -> 10-base: foomuuri_ssh_port, foomuuri_ssh_sources
#   firewall_normalize_services   normalized/<env>/group_vars/all.yml
#                                 -> 20-normalize: foomuuri_services
#   firewall_specialize_services  normalized/<env>/group_vars/<group>.yml
#                                 -> 30-specialize: foomuuri_services
#
# firewall_onboard_ssh is a mapping, port and sources. A service list holds
# entries as foomuuri_services does: name (a Foomuuri macro such as http, or a
# port), protocol (default tcp), sources (empty or absent means any) and state
# (absent leaves the entry out). Empty sources mean any address, IPv4 or IPv6.
#
# This file turns them into the rule list uc_firewall reads, one rule per
# source. Each playbook loads it with vars_files and sets uc_firewall_stages to
# the stages it applies. A stage that is not loaded contributes nothing, and
# without firewall_onboard_ssh there is no SSH rule, so uc_firewall refuses.

# The Foomuuri macros uc_firewall can apply, with the TCP port of each. Any
# other name is passed on as the port.
uc_firewall_macro_ports:
  ssh: 22
  http: 80
  https: 443

firewall_rules: >-
  {%- set ns = namespace(rules=[]) -%}
  {%- if 'onboard' in uc_firewall_stages and firewall_onboard_ssh is defined -%}
  {%- for source in (firewall_onboard_ssh.sources | default([])) or [none] -%}
  {%- set ns.rules = ns.rules + [{'name': 'allow-ssh', 'protocol': 'tcp',
      'port': firewall_onboard_ssh.port | default(22)}
      | combine({'source': source} if source else {})] -%}
  {%- endfor -%}
  {%- endif -%}
  {%- set services = ((firewall_normalize_services | default([])) if 'normalize' in uc_firewall_stages else [])
      + ((firewall_specialize_services | default([])) if 'specialize' in uc_firewall_stages else []) -%}
  {%- for service in services if (service.state | default('present')) != 'absent' -%}
  {%- for source in (service.sources | default([])) or [none] -%}
  {%- set ns.rules = ns.rules + [{'name': 'allow-' ~ service.name,
      'port': uc_firewall_macro_ports.get(service.name | string, service.name),
      'protocol': service.protocol | default('tcp')} | combine({'source': source} if source else {})] -%}
  {%- endfor -%}
  {%- endfor -%}
  {{ ns.rules }}
