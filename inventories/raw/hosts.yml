# inventories/raw/hosts.yml
#
# Static inventory, maintained by hand. No playbook or script writes to it.
# Raw is what the sources report: no script adds a host to any file under
# inventories/raw/, and demotion to raw writes nothing here.
#
# Invariant: every raw host is a member of raw and of exactly one source group.
# Each source group is a child of raw, so 10_onboard.yml can target hosts: raw
# whatever the source. Hosts are not listed here: they come from the source's
# own root-level file in inventories/raw/, a dynamic plugin config (incus.yml)
# or a generated inventory (discovered.yml). Connection settings for each
# source live in group_vars/<source>.yml.
#
# Adding a source: add its group under raw.children here, add
# group_vars/<source>.yml with how it is reached, and add the root-level file
# that supplies its hosts.
raw:
  children:
    incus: {}       # Incus instances, from incus.yml
    discovered: {}  # SSH-reachable nodes found by 00_discover.yml
