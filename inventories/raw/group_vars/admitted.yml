---
# inventories/raw/group_vars/admitted.yml
#
# Maintained by hand.
# Raw nodes that meet the raw node contract, admitted by
# ingress/playbooks/05_admit.yml into inventories/raw/admitted.yml. They are
# reached as the contract says: SSH as initial with the controller's key,
# offered alone; sudo asks for the batch password the node was built with.
# ansible_host, ansible_port and raw_node_batch are set per host by the
# generated inventory.
#
# Load the onboard inventory too (-i inventories/onboard/dev), which defines
# onboard_ssh_private_key_file, as 10_onboard.yml requires.

ansible_connection: ssh
ansible_user: initial
ansible_ssh_private_key_file: "{{ onboard_ssh_private_key_file }}"

# Strict host key checking for this group only. ansible.cfg turns checking
# off for the other sources, whose test nodes are rebuilt often; this
# variable overrides it per host, so Ansible no longer adds
# StrictHostKeyChecking=no. Keys are checked against ssh/known_hosts alone,
# under the inventory hostname (HostKeyAlias), never ~/.ssh/known_hosts.
ansible_ssh_host_key_checking: true
uc_repo_dir: "{{ inventory_dir | dirname | dirname }}"
ansible_ssh_common_args: >-
  -o IdentitiesOnly=yes
  -o StrictHostKeyChecking=yes
  -o HostKeyAlias={{ inventory_hostname }}
  -o UserKnownHostsFile={{ uc_repo_dir }}/ssh/known_hosts
  -o GlobalKnownHostsFile=/dev/null
  -o PasswordAuthentication=no
  -o KbdInteractiveAuthentication=no

# The become password is the password of the batch the node was built with,
# decrypted from secrets/raw-batches/<raw_node_batch>.vault only when a task
# needs it. A host without raw_node_batch fails here; there is no default.
ansible_become_password: >-
  {{ lookup('ansible.builtin.unvault',
            uc_repo_dir ~ '/secrets/raw-batches/' ~ raw_node_batch ~ '.vault') | trim }}
