---
# inventories/onboard/dev/group_vars/all.yml
# Variables for the onboard baseline roles, dev environment.
#
# Only values we deliberately choose are set here. Every other role variable
# keeps its upstream default, which is the point of using these roles.

# --- connection contract -------------------------------------------------
# Controller-side private key for the initial user. 10_onboard.yml uses it
# when it switches a node to SSH, and writes it onto each promoted host in
# hosts.yml as ansible_ssh_private_key_file. Referenced, never hardcoded.
onboard_ssh_private_key_file: ~/.ssh/gradus-raw-initial-id_ed25519

# --- umask (steelcj.umask) -------------------------------------------------
# System-wide tight umask, applied before the initial user is created so its
# home directory is created 0750. umask_users: [] skips the per-user .bashrc
# step in favour of the system-wide login.defs / profile.d config.
umask: "0027"
umask_system: true
umask_home_mode: "0750"
umask_users: []

# --- openssh (robertdebock.openssh) ----------------------------------------
# Harden sshd to key-only, no root login. Safe during onboarding because this
# stage runs over the incus connection, not ssh, so a restart cannot lock us
# out, and the initial user is created with a key before we switch to ssh.
openssh_permit_root_login: "no"
openssh_password_authentication: "no"
openssh_challenge_response_authentication: "no"
openssh_x11_forwarding: "no"

# --- locale (robertdebock.locale) ------------------------------------------
locale_lang: en_US.UTF-8          # en_CA.UTF-8 if you prefer, must be available
locale_timezone: America/Toronto  # Etc/UTC if you keep servers on UTC

# --- ntp (robertdebock.ntp) ------------------------------------------------
ntp_timezone: America/Toronto     # keep in step with locale_timezone
# ntp_pool defaults to pool.ntp.org; set ntp_server for an internal source.

# --- firewall (uc_firewall) ------------------------------------------------
# The onboard stage's firewall rules. The plays combine firewall_rules_onboard,
# firewall_rules_normalize and firewall_rules_specialize into firewall_rules,
# which roles/uc_firewall applies. Schema: name, port, protocol (default tcp),
# and optional source (no source means open to all addresses). The SSH rule
# must stay: uc_firewall refuses to enable the firewall without it.
firewall_rules_onboard:
  - name: allow-ssh
    port: 22
    protocol: tcp

# --- users (robertdebock.users) --------------------------------------------
# Creates the initial management user with your key and passwordless sudo.
# Replace the placeholder with your controller's real public key.
users:
  - name: initial
    comment: Ansible management user
    sudo_options: "ALL=(ALL) NOPASSWD: ALL"
    authorized_keys:
      - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIB23smky5gSvrdOOYqyt+sck93NqAMqrz322BX18h1d9 initial@laptop"
# above is gradus-raw-initial pub key
