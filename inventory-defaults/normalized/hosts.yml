# inventory-defaults/normalized/hosts.yml
#
# The normalized stage's group structure, maintained by hand in uc-controller.
# It lists no hosts: a client inventory's normalized/<environment>/hosts.yml
# supplies them, written by promote_node.py, with any extra groups a host is
# promoted into (webservers and the like). The normalized stage has no logic
# of its own, so there is no group_vars/ here. Load it before the client's
# normalized/<environment>/ directory; scripts/inventory-args gives both.
---
normalized: {}
