# inventory-defaults/raw/hosts.yml
#
# The raw stage's group structure, maintained by hand in uc-controller. It
# lists no hosts: a client inventory's raw/ directory supplies them, through
# the source's own root-level file there, a dynamic plugin config (incus.yml)
# or a generated inventory (discovered.yml, admitted.yml). Load it before the
# client's raw/ directory; scripts/inventory-args gives both, in that order.
#
# Invariant: every raw host is a member of raw and of exactly one source group.
# Each source group is a child of raw, so 10_onboard.yml can target hosts: raw
# whatever the source. Connection settings for each source live in
# group_vars/<source>.yml beside this file.
#
# Adding a source: add its group under raw.children here, add
# group_vars/<source>.yml with how it is reached, and add the root-level file
# that supplies its hosts to the client inventory template's raw/.
---
raw:
  children:
    incus: {}       # Incus instances, from the client's raw/incus.yml
    discovered: {}  # SSH-reachable nodes found by 00_discover.yml
    admitted: {}    # raw contract nodes admitted by 05_admit.yml, SSH as initial
