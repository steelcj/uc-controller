---
# ingress/playbooks/tasks/admit_candidate.yml
#
# Steps 1 to 5 of 05_admit.yml for one candidate address, on the controller.
# Read-only towards the node: it runs ssh-keyscan and one cat as initial.
# Appends one result to admit_results:
#
#   address, hostname, outcome, message, findings (non-failing notes and
#   warnings), line (one line for the report), and, when admitted, entry
#   (the host's vars for admitted.yml), known_hosts (its key lines under the
#   hostname) and python (the reported interpreter).
#
# Outcomes: admitted, known, refused (breaks the contract or host keys
# differ), stopped (reinstall, name collision, known under another name),
# not-contract (no SSH, or the controller key or confirmation is refused).
# Every step after the first runs only while the outcome is pending.

- name: "{{ candidate }}: start"
  ansible.builtin.set_fact:
    admit_one:
      address: "{{ candidate }}"
      hostname: ""
      outcome: pending
      message: ""
      findings: []
    admit_keys_file: "{{ admit_tmp.path }}/{{ candidate | regex_replace('[^A-Za-z0-9.-]', '_') }}.keys"

# 1. Host keys, into a temporary file only.
- name: "{{ candidate }}: fetch the SSH host keys"
  ansible.builtin.command:
    argv: [ssh-keyscan, -T, "5", -p, "{{ admit_port }}", "{{ candidate }}"]
  register: admit_scan
  changed_when: false
  failed_when: false

- name: "{{ candidate }}: no SSH server"
  ansible.builtin.set_fact:
    admit_one: "{{ admit_one | combine({'outcome': 'not-contract',
                   'message': 'no SSH server answered on port ' ~ admit_port}) }}"
  when: admit_scan.stdout_lines | reject('match', '^#') | list | length == 0

- name: "{{ candidate }}: keep the scanned keys for this connection only"
  ansible.builtin.copy:
    dest: "{{ admit_keys_file }}"
    content: "{{ admit_scan.stdout }}\n"
    mode: "0600"
  when: admit_one.outcome == 'pending'

# 2. The confirmation, read as initial with the controller's key alone,
# trusting only the scanned keys. -F /dev/null ignores ~/.ssh/config.
- name: "{{ candidate }}: read the confirmation as {{ admit_user }}"
  ansible.builtin.command:
    argv:
      - ssh
      - -F
      - /dev/null
      - -o
      - BatchMode=yes
      - -o
      - IdentitiesOnly=yes
      - -o
      - PasswordAuthentication=no
      - -o
      - KbdInteractiveAuthentication=no
      - -o
      - StrictHostKeyChecking=yes
      - -o
      - "UserKnownHostsFile={{ admit_keys_file }}"
      - -o
      - GlobalKnownHostsFile=/dev/null
      - -o
      - ConnectTimeout=10
      - -i
      - "{{ admit_key }}"
      - -p
      - "{{ admit_port }}"
      - -l
      - "{{ admit_user }}"
      - "{{ candidate }}"
      - cat /var/lib/raw-node/confirmation.yml
  register: admit_read
  changed_when: false
  failed_when: false
  when: admit_one.outcome == 'pending'

- name: "{{ candidate }}: not a contract node"
  ansible.builtin.set_fact:
    admit_one: >-
      {{ admit_one | combine({'outcome': 'not-contract', 'message':
         ('SSH as ' ~ admit_user ~ ' with the controller key failed: '
          if admit_read.rc == 255 else 'no readable confirmation: ')
         ~ (admit_read.stderr_lines | last | default('rc ' ~ admit_read.rc))}) }}
  when: admit_one.outcome == 'pending' and admit_read.rc != 0

# 3. The contract check.
- name: "{{ candidate }}: check the confirmation against the raw node contract"
  ansible.builtin.command:
    argv:
      - "{{ admit_python }}"
      - "{{ admit_repo }}/scripts/check_raw_confirmation.py"
      - "-"
      - --user
      - "{{ admit_user }}"
      - --port
      - "{{ admit_port }}"
      - --compact
    stdin: "{{ admit_read.stdout }}"
  register: admit_check
  changed_when: false
  failed_when: admit_check.rc not in [0, 1, 2]
  when: admit_one.outcome == 'pending'

- name: "{{ candidate }}: read the result"
  ansible.builtin.set_fact:
    admit_report: "{{ admit_check.stdout | from_json }}"
    admit_one: >-
      {{ admit_one | combine({
           'hostname': (admit_check.stdout | from_json)['values'].hostname | default('', true),
           'findings': (admit_check.stdout | from_json).findings | rejectattr('severity', 'eq', 'fail') | list}) }}
  when: admit_one.outcome == 'pending'

- name: "{{ candidate }}: refuse a confirmation that breaks the contract"
  ansible.builtin.set_fact:
    admit_one: >-
      {{ admit_one | combine({'outcome': 'refused', 'message':
         (admit_report.error | default(''))
         ~ (admit_fails | map(attribute='clause') | zip(
              admit_fails | map(attribute='field'), admit_fails | map(attribute='message'))
            | map('join', ' ') | join('; '))}) }}
  vars:
    admit_fails: "{{ admit_report.findings | selectattr('severity', 'eq', 'fail') | list }}"
  when: admit_one.outcome == 'pending' and admit_report.result != 'pass'

# RN-ACC-08 cannot be measured on the node: the controller knows whether the
# batch password meets the length.
- name: "{{ candidate }}: report a batch password under 15 characters"
  ansible.builtin.set_fact:
    admit_one: >-
      {{ admit_one | combine({'findings': admit_one.findings + [{
           'severity': 'warning', 'clause': 'RN-ACC-08', 'field': 'initial_password',
           'message': 'batch ' ~ admit_batch ~ ' has a password under 15 characters '
                      '(meets_min_length: false); RN-ACC-08 is not met'}]}) }}
  when: admit_one.outcome == 'pending' and not admit_index.batches[admit_batch].meets_min_length

# 4. Host keys: the confirmation must list exactly the keys the node presented.
- name: "{{ candidate }}: fingerprint the scanned keys"
  ansible.builtin.command:
    argv: [ssh-keygen, -l, -E, sha256, -f, "{{ admit_keys_file }}"]
  register: admit_fingerprints
  changed_when: false
  when: admit_one.outcome == 'pending'

- name: "{{ candidate }}: compare host keys"
  ansible.builtin.set_fact:
    admit_scanned: "{{ admit_fingerprints.stdout | regex_findall('SHA256:[A-Za-z0-9+/]+') | unique | sort }}"
    admit_confirmed: "{{ admit_report['values'].ssh_host_keys | map(attribute='fingerprint') | unique | sort }}"
  when: admit_one.outcome == 'pending'

- name: "{{ candidate }}: refuse when the host keys differ"
  ansible.builtin.set_fact:
    admit_one: >-
      {{ admit_one | combine({'outcome': 'refused', 'message':
         'host keys differ: presented ' ~ (admit_scanned | join(', '))
         ~ '; confirmation lists ' ~ (admit_confirmed | join(', '))}) }}
  when: admit_one.outcome == 'pending' and admit_scanned != admit_confirmed

- name: "{{ candidate }}: refuse when the console fingerprint is not among them"
  ansible.builtin.set_fact:
    admit_one: >-
      {{ admit_one | combine({'outcome': 'refused', 'message':
         'the console fingerprint ' ~ admit_expected_fingerprint ~ ' is not among the host keys '
         ~ (admit_scanned | join(', '))}) }}
  when:
    - admit_one.outcome == 'pending'
    - admit_expected_fingerprint is defined
    - admit_expected_fingerprint not in admit_scanned

- name: "{{ candidate }}: warn that the host key was trusted on first use"
  ansible.builtin.set_fact:
    admit_one: >-
      {{ admit_one | combine({'findings': admit_one.findings + [{
           'severity': 'warning', 'clause': 'PA-HOST-01', 'field': 'ssh_host_keys',
           'message': 'host key trusted on first use: no admit_expected_fingerprint was '
                      'given to compare with the console'}]}) }}
  when: admit_one.outcome == 'pending' and admit_expected_fingerprint is not defined

# 5. Identity. Another candidate of this run may be the same node at
# another address, before anything is written.
- name: "{{ candidate }}: the same node at another address in this run"
  ansible.builtin.set_fact:
    admit_one: >-
      {{ admit_one | combine({'outcome': 'known', 'message': admit_one.hostname
         ~ ' is admitted in this run at another address'}) }}
  when:
    - admit_one.outcome == 'pending'
    - admit_one.hostname in (admit_results | selectattr('outcome', 'eq', 'admitted') | map(attribute='hostname'))

- name: "{{ candidate }}: match the identity against every stage inventory"
  ansible.builtin.command:
    argv: >-
      {{ [admit_python, admit_repo ~ '/scripts/match_raw_identity.py',
          '--hostname', admit_one.hostname,
          '--machine-id', admit_report['values'].machine_id, '--compact']
         + (admit_report['values'].macs | map('regex_replace', '^', '--mac=') | list) }}
  register: admit_match
  changed_when: false
  when: admit_one.outcome == 'pending'

- name: "{{ candidate }}: apply the identity decision"
  ansible.builtin.set_fact:
    admit_one: >-
      {{ admit_one | combine({
           'outcome': {'new': 'pending', 'known': 'known'}.get((admit_match.stdout | from_json).decision, 'stopped'),
           'message': (admit_match.stdout | from_json).message}) }}
  when: admit_one.outcome == 'pending'

# 6, first half: what admission writes. The play writes it for all
# candidates at once.
- name: "{{ candidate }}: admit"
  ansible.builtin.set_fact:
    admit_one: >-
      {{ admit_one | combine({
           'outcome': 'admitted',
           'python': admit_report['values'].python | default('', true),
           'entry': {
             'ansible_host': candidate,
             'ansible_port': admit_port | int,
             'raw_node_contract': admit_report['values'].contract,
             'raw_node_baseline': admit_report['values'].baseline,
             'raw_node_machine_id': admit_report['values'].machine_id,
             'raw_node_macs': admit_report['values'].macs,
             'raw_node_batch': admit_batch,
             'raw_node_admitted': now().astimezone().isoformat(timespec='seconds')},
           'known_hosts': admit_scan.stdout_lines | reject('match', '^#') | reject('equalto', '')
                          | map('regex_replace', '^\S+\s+', admit_one.hostname ~ ' ') | list}) }}
  when: admit_one.outcome == 'pending'

- name: "{{ candidate }}: record the result"
  ansible.builtin.set_fact:
    admit_results: >-
      {{ admit_results + [admit_one | combine({'line':
           candidate ~ ': ' ~ admit_one.outcome
           ~ ((' ' ~ admit_one.hostname) if admit_one.hostname else '')
           ~ ((' - ' ~ admit_one.message) if admit_one.message else '')
           ~ (admit_one.findings | map(attribute='severity') | zip(
                admit_one.findings | map(attribute='clause'),
                admit_one.findings | map(attribute='message'))
              | map('join', ' ') | map('regex_replace', '^', '; ') | join(''))})] }}
