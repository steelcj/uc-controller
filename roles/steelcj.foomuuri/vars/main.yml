---
# vars file for foomuuri

# Packages that manage the same nftables ruleset and must not run beside
# Foomuuri.
_foomuuri_packages_conflicting:
  default:
    - ufw
    - firewalld

foomuuri_packages_conflicting: "{{ _foomuuri_packages_conflicting[ansible_facts['distribution'] ~ '-' ~ ansible_facts['distribution_major_version']] | default(_foomuuri_packages_conflicting[ansible_facts['distribution']] | default(_foomuuri_packages_conflicting[ansible_facts['os_family']] | default(_foomuuri_packages_conflicting['default']))) }}"

_foomuuri_packages:
  default:
    - foomuuri

foomuuri_packages: "{{ _foomuuri_packages[ansible_facts['distribution'] ~ '-' ~ ansible_facts['distribution_major_version']] | default(_foomuuri_packages[ansible_facts['distribution']] | default(_foomuuri_packages[ansible_facts['os_family']] | default(_foomuuri_packages['default']))) }}"

foomuuri_service: foomuuri

foomuuri_etc_dir: /etc/foomuuri

# The fragments and files this call manages, as paths relative to
# foomuuri_etc_dir. Everything else is purged when foomuuri_purge is unmanaged.
foomuuri_managed_files: "{{ ([foomuuri_fragment] + foomuuri_keep_fragments) | map('regex_replace', '^(.*?)(\\.conf)?$', '\\1.conf') | list + (foomuuri_files | map(attribute='name') | list) + foomuuri_purge_exclude }}"

# The SSH rule, as a service, for the base fragment.
foomuuri_ssh_service:
  name: "{{ 'ssh' if (foomuuri_ssh_port | int) == 22 else (foomuuri_ssh_port | string) }}"
  protocol: tcp
  sources: "{{ foomuuri_ssh_sources }}"
