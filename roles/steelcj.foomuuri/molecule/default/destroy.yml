---
- name: Destroy
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Delete the instances
      ansible.builtin.command:
        cmd: >-
          incus delete {{ item.name }} --force
          --project {{ item.incus_project | default('default') }}
      loop: "{{ molecule_yml.platforms }}"
      loop_control:
        label: "{{ item.name }}"
      register: destroy_delete
      changed_when: destroy_delete.rc == 0
      failed_when:
        - destroy_delete.rc != 0
        - "'not found' not in destroy_delete.stderr | lower"

    - name: Empty the instance config
      ansible.builtin.copy:
        content: "{{ [] | to_yaml }}"
        dest: "{{ molecule_instance_config }}"
        mode: "0600"
