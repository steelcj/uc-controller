---
- name: Verify
  hosts: all
  become: true
  gather_facts: false

  tasks:
    - name: Read the fragment
      ansible.builtin.slurp:
        src: /etc/foomuuri/10-base.conf
      register: verify_fragment

    - name: Test if the fragment holds the calculated rules
      ansible.builtin.assert:
        that:
          - "'tcp 2222 saddr 192.0.2.0/24 2001:db8::/32' in verify_fragment_text"
          - "'  https' in verify_fragment_text"
          - "'tcp 1337' in verify_fragment_text"
          - "'udp 5353 saddr 198.51.100.0/24' in verify_fragment_text"
          - "'  http\n' not in verify_fragment_text"
          - "'  ssh\n' not in verify_fragment_text"
        quiet: true
      vars:
        verify_fragment_text: "{{ verify_fragment.content | b64decode }}"

    - name: Read the installed Foomuuri version
      ansible.builtin.command:
        cmd: foomuuri --version
      changed_when: false
      register: verify_version

    - name: Test if the public zone matches the installed version
      ansible.builtin.assert:
        that:
          - verify_public_line in verify_fragment.content | b64decode
        quiet: true
      vars:
        verify_public_line: "{{ '  public *' if verify_version.stdout | trim is version('0.33', '>=') else '  public eth* en* wl*' }}"

    - name: Check the configuration
      ansible.builtin.command:
        cmd: foomuuri check
      changed_when: false

    - name: Read the state of the services
      ansible.builtin.systemd_service:
        name: "{{ item }}"
      loop:
        - foomuuri.service
        - nftables.service
      register: verify_services

    - name: Test if foomuuri is active and enabled, and nftables.service is masked
      ansible.builtin.assert:
        that:
          - verify_services.results[0].status.ActiveState == 'active'
          - verify_services.results[0].status.UnitFileState == 'enabled'
          - verify_services.results[1].status.LoadState == 'masked'
        quiet: true

    - name: List the nftables tables
      ansible.builtin.command:
        cmd: nft list tables
      changed_when: false
      register: verify_tables

    - name: Test if Foomuuri's table is the only one
      ansible.builtin.assert:
        that:
          - verify_tables.stdout_lines | length == 1
          - "'foomuuri' in verify_tables.stdout"
        quiet: true

    - name: Read the loaded ruleset
      ansible.builtin.command:
        cmd: nft list ruleset
      changed_when: false
      register: verify_ruleset

    - name: Test if the SSH port is in the loaded ruleset
      ansible.builtin.assert:
        that:
          - "'2222' in verify_ruleset.stdout"
        quiet: true
