---
# tasks file for foomuuri

- name: Import assert.yml
  ansible.builtin.import_tasks:
    file: assert.yml
  run_once: true
  delegate_to: localhost

- name: Remove conflicting software
  ansible.builtin.package:
    name: "{{ foomuuri_packages_conflicting }}"
    state: absent
  when:
    - foomuuri_disable_conflicting | bool
    - foomuuri_packages_conflicting | length > 0

- name: Install required software
  ansible.builtin.package:
    name: "{{ foomuuri_packages }}"
    state: present

- name: Read the installed Foomuuri version
  ansible.builtin.command:
    cmd: foomuuri --version
  changed_when: false
  check_mode: false
  register: foomuuri_version

- name: Test if the installed Foomuuri is recent enough
  ansible.builtin.assert:
    that:
      - foomuuri_version.stdout | trim is version(foomuuri_minimum_version, '>=')
    fail_msg: "Foomuuri {{ foomuuri_version.stdout | trim }} is installed, {{ foomuuri_minimum_version }} or later is required."
    quiet: true

- name: Mask nftables.service
  ansible.builtin.systemd_service:
    name: nftables.service
    masked: true
  when:
    - foomuuri_disable_conflicting | bool
    - ansible_connection not in foomuuri_skip_connections

- name: Place the fragment
  ansible.builtin.template:
    src: foomuuri.conf.j2
    dest: "{{ foomuuri_etc_dir }}/{{ foomuuri_fragment }}.conf"
    owner: root
    group: root
    mode: "0644"
  when:
    - foomuuri_fragment_state == 'present'
  notify:
    - Reload foomuuri
  register: foomuuri_place_fragment

- name: Remove the fragment
  ansible.builtin.file:
    path: "{{ foomuuri_etc_dir }}/{{ foomuuri_fragment }}.conf"
    state: absent
  when:
    - foomuuri_fragment_state == 'absent'
  notify:
    - Reload foomuuri
  register: foomuuri_remove_fragment

- name: Place extra files
  ansible.builtin.copy:
    content: "{{ item.content | default(omit) }}"
    src: "{{ item.src | default(omit) }}"
    dest: "{{ foomuuri_etc_dir }}/{{ item.name }}"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ foomuuri_files | rejectattr('state', 'defined') | list + (foomuuri_files | selectattr('state', 'defined') | selectattr('state', 'equalto', 'present') | list) }}"
  loop_control:
    label: "{{ item.name }}"
  notify:
    - Reload foomuuri
  register: foomuuri_place_files

- name: Remove extra files
  ansible.builtin.file:
    path: "{{ foomuuri_etc_dir }}/{{ item.name }}"
    state: absent
  loop: "{{ foomuuri_files | selectattr('state', 'defined') | selectattr('state', 'equalto', 'absent') | list }}"
  loop_control:
    label: "{{ item.name }}"
  notify:
    - Reload foomuuri
  register: foomuuri_remove_files

- name: Find configuration files
  ansible.builtin.find:
    paths: "{{ foomuuri_etc_dir }}"
    patterns: "*.conf"
    recurse: true
  register: foomuuri_found_files
  when:
    - foomuuri_purge == 'unmanaged'

- name: Remove unmanaged configuration files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ foomuuri_found_files.files | map(attribute='path') | reject('in', foomuuri_managed_files | map('regex_replace', '^', foomuuri_etc_dir ~ '/') | list) | list }}"
  when:
    - foomuuri_purge == 'unmanaged'
  notify:
    - Reload foomuuri
  register: foomuuri_purge_files

- name: Check the configuration
  ansible.builtin.command:
    cmd: foomuuri check
  changed_when: false
  when:
    - foomuuri_place_fragment is changed or
      foomuuri_remove_fragment is changed or
      foomuuri_place_files is changed or
      foomuuri_remove_files is changed or
      foomuuri_purge_files is changed

- name: Start and enable foomuuri
  ansible.builtin.systemd_service:
    name: "{{ foomuuri_service }}"
    state: started
    enabled: true
  when:
    - ansible_connection not in foomuuri_skip_connections
